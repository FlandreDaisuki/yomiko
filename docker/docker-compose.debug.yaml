x-yomiko-build: &yomiko-build
  context: ..
  dockerfile: docker/Dockerfile

services:
  yomiko.debug:
    image: "${YOMIKO_IMAGE:-yomiko.debug}"
    build:
      <<: *yomiko-build
      target: debug
    container_name: yomiko.debug
    ports:
      - "${YOMIKO_BIND_ADDRESS:-127.0.0.1}:${YOMIKO_PORT:-62080}:80"
    environment:
      YOMIKO_ENABLE_WEB: "${YOMIKO_ENABLE_WEB:-true}"
      YOMIKO_API_TOKEN: "${YOMIKO_API_TOKEN:-}"
      YOMIKO_BIND_ADDRESS: "${YOMIKO_BIND_ADDRESS:-127.0.0.1}"
      YOMIKO_CANONICAL_FAVORITE_CATEGORY: "${YOMIKO_CANONICAL_FAVORITE_CATEGORY:-}"
      YOMIKO_ALTERNATE_FAVORITE_CATEGORY: "${YOMIKO_ALTERNATE_FAVORITE_CATEGORY:-}"
      YOMIKO_CONVERSION_JOBS: "${YOMIKO_CONVERSION_JOBS:-4}"
      MAGICK_MEMORY_LIMIT: "${MAGICK_MEMORY_LIMIT:-1GiB}"
      MAGICK_MAP_LIMIT: "${MAGICK_MAP_LIMIT:-1GiB}"
      MAGICK_THREAD_LIMIT: "${MAGICK_THREAD_LIMIT:-1}"
      YOMIKO_7Z_MEMORY_LIMIT: "${YOMIKO_7Z_MEMORY_LIMIT:-}"
    volumes:
      - "${HOST_HATH_DOWNLOAD_DIR}:/home/yomiko/hath"
      - "${HOST_ARCHIVED_DIR}:/home/yomiko/archived"
      - "../data:/home/yomiko/data"
      - "../logs:/home/yomiko/logs"
    develop:
      watch:
        - action: sync+restart
          path: ../bin
          target: /home/yomiko/bin
        - action: sync+restart
          path: ../cronjobs
          target: /home/yomiko/cronjobs
        - action: sync+restart
          path: ../entrypoint.sh
          target: /home/yomiko/entrypoint.sh
        - action: sync+restart
          path: ../lib
          target: /home/yomiko/lib
        - action: sync+restart
          path: ../migrations
          target: /home/yomiko/migrations
        - action: sync+restart
          path: ../server
          target: /home/yomiko/server
        - action: sync+restart
          path: ../web
          target: /home/yomiko/web
        - action: sync+restart
          path: ../debug/web
          target: /home/yomiko/web
        - action: rebuild
          path: ./Dockerfile
    command: /home/yomiko/entrypoint.sh

  yomiko.test:
    image: "${YOMIKO_TEST_IMAGE:-yomiko.test}"
    build:
      <<: *yomiko-build
      target: test
    container_name: yomiko.test
    command: /home/yomiko/tests/run.sh
    restart: "no"
    healthcheck:
      disable: true

# start with watch and rebuild the image first
#   mkdir -p data && docker compose -f docker/docker-compose.debug.yaml --project-name yomiko-debug up --build --watch
# yomiko.test uses the shared base stage, runs once, and exits; yomiko.debug does not contain tests.

# exec
#   docker compose -f docker/docker-compose.debug.yaml --project-name yomiko-debug exec yomiko.debug bash

# call from host
#   curl -X PUT -H "Authorization: Bearer ${YOMIKO_API_TOKEN}" 'http://localhost:62080/api/hath_download.sh?gid=123456'
#   curl 'http://localhost:62080/health'
