name: yomiko

services:
  yomiko:
    image: ghcr.io/flandredaisuki/yomiko:latest
    pull_policy: always
    init: true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "${YOMIKO_BIND_ADDRESS:-0.0.0.0}:${YOMIKO_PORT:-62080}:80"
    environment:
      # Optional values are passed through from the shell or .env only when set.
      YOMIKO_ENABLE_WEB:
      YOMIKO_API_TOKEN:
      YOMIKO_METRICS_TOKEN_FILE:
      YOMIKO_CANONICAL_FAVORITE_CATEGORY:
      YOMIKO_ALTERNATE_FAVORITE_CATEGORY:
      YOMIKO_CONVERSION_JOBS:
      MAGICK_MEMORY_LIMIT:
      MAGICK_MAP_LIMIT:
      MAGICK_THREAD_LIMIT:
      YOMIKO_7Z_MEMORY_LIMIT:
      YOMIKO_SQLITE_BUSY_TIMEOUT_MS:
      YOMIKO_DB_WRITER_GATE_TIMEOUT_MS:
    volumes:
      - "${HOST_HATH_DOWNLOAD_DIR:?Set HOST_HATH_DOWNLOAD_DIR in .env}:/home/yomiko/hath"
      - "${HOST_ARCHIVED_DIR:?Set HOST_ARCHIVED_DIR in .env}:/home/yomiko/archived"
      # A configured host path replaces the default Docker-managed volume.
      - "${HOST_DATA_DIR:-yomiko-data}:/home/yomiko/data"
      # DEPRECATED: HOST_LOG_DIR no longer receives scheduler output. Use
      # Docker logs for scans and workers.
      # Uncomment only to persist /home/yomiko/logs/yomiko-writer.log.
      # - "${HOST_LOG_DIR:-./logs}:/home/yomiko/logs"

volumes:
  yomiko-data:
